[project]
name = "resonance"
version = "1.0.0"
requires-python = ">=3.10,<3.13"

dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.*",
    "transformers>=4.35.0",
    "numpy>=2.0.0",
    "scipy",
    "omegaconf>=2.3.0",
    "sentencepiece>=0.1.99",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.0",
    "tqdm",
    "gigaam @ git+https://github.com/salute-developers/GigaAM.git",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "playwright",
    "pytest-playwright",
]

[tool.pytest.ini_options]
pythonpath = ["."]
base_url = "http://localhost:8000"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
