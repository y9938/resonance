<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/locales/manifest.js"></script>
    <script>
    (function () {
        var KEY = 'resonance_locale';
        var MANIFEST = window.__resonanceLocaleManifest || {};
        var DEFAULT_LOCALE = MANIFEST.defaultLocale || 'en';
        var CONFIG = Array.isArray(MANIFEST.locales) ? MANIFEST.locales : [];

        function canonicalizeLocale(loc) {
            try {
                var list = Intl.getCanonicalLocales(String(loc || '').trim());
                return list && list.length ? list[0] : null;
            } catch (e) {
                return null;
            }
        }

        function findLocaleCode(loc) {
            var canonical = canonicalizeLocale(loc);
            if (!canonical) return null;
            for (var i = 0; i < CONFIG.length; i++) {
                var item = CONFIG[i];
                if (item.code === canonical) return item.code;
            }
            var base = canonical.split('-')[0];
            for (var j = 0; j < CONFIG.length; j++) {
                if (CONFIG[j].code === base) return CONFIG[j].code;
            }
            return null;
        }

        window.__resonanceResolveLocale = function () {
            try {
                var s = localStorage.getItem(KEY);
                var stored = findLocaleCode(s);
                if (stored) return stored;
            } catch (e) {}
            var list = navigator.languages || [navigator.language || ''];
            for (var i = 0; i < list.length; i++) {
                var matched = findLocaleCode(list[i]);
                if (matched) return matched;
            }
            return DEFAULT_LOCALE;
        };
        document.documentElement.lang = window.__resonanceResolveLocale();
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="meta-desc" name="description" data-i18n="metaDescription" data-i18n-attr="content" content="Resonance — Speech-to-Text and Text-to-Speech">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A962' stroke-width='2'%3E%3Cpath d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/%3E%3Cpath d='M19 10v2a7 7 0 0 1-14 0v-2'/%3E%3Cline x1='12' x2='12' y1='19' y2='22'/%3E%3C/svg%3E">
    <title data-i18n="pageTitle">Resonance</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --border: #2a2a2a;
            --border-hover: #3a3a3a;
            --text-primary: #f5f0e6;
            --text-secondary: #a0a0a0;
            --text-muted: #606060;
            --accent: #c9a962;
            --accent-hover: #d4b76d;
            --error: #c95c5c;
            --success: #5cc95c;
            --radius: 8px;
            --radius-sm: 4px;
            --transition: 150ms ease;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--accent);
            font-weight: 500;
            font-size: 1.125rem;
            letter-spacing: -0.01em;
        }

        .brand svg { width: 20px; height: 20px; }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .menu-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color var(--transition), color var(--transition);
        }

        .menu-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .jobs-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: min(320px, 86vw);
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            transform: translateX(-100%);
            transition: transform 180ms ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .jobs-drawer.open {
            transform: translateX(0);
        }

        .jobs-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .jobs-drawer-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .jobs-drawer-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .jobs-list-sentinel {
            height: 1px;
            width: 100%;
            pointer-events: none;
        }

        .jobs-footer {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .jobs-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
            z-index: 40;
        }

        .jobs-drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .locale-picker {
            position: relative;
            width: 180px;
        }

        .locale-picker-input {
            width: 100%;
            padding: 0.55rem 2.1rem 0.55rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .locale-picker-input::placeholder {
            color: var(--text-muted);
            text-transform: none;
            letter-spacing: 0;
        }

        .locale-picker-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 169, 98, 0.12);
        }

        .locale-picker-caret {
            position: absolute;
            top: 50%;
            right: 0.7rem;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
            transition: transform var(--transition), color var(--transition);
        }

        .locale-picker.open .locale-picker-caret {
            transform: translateY(-50%) rotate(180deg);
            color: var(--accent);
        }

        .locale-picker-list {
            position: absolute;
            top: calc(100% + 0.4rem);
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            padding: 0.3rem;
            display: none;
            z-index: 30;
        }

        .locale-picker.open .locale-picker-list {
            display: block;
        }

        .locale-option {
            width: 100%;
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 0.65rem;
            align-items: center;
            padding: 0.55rem 0.65rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }

        .locale-option:hover,
        .locale-option.active {
            background: var(--bg-tertiary);
        }

        .locale-option:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        .locale-option.selected .locale-option-code {
            color: var(--accent);
        }

        .locale-option-code {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .locale-option-label {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .locale-option-name {
            font-size: 0.84rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .locale-option-native {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.2;
            margin-top: 0.1rem;
        }

        .locale-picker-empty {
            padding: 0.7rem 0.8rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 3rem 1.5rem;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .tab {
            padding: 0.625rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
        }

        .tab:hover { color: var(--text-primary); }
        .tab.active { background: var(--bg-tertiary); color: var(--text-primary); }

        .panel { display: none; width: 100%; }
        .panel.active { display: block; animation: fadeIn 200ms ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .dropzone:hover { border-color: var(--border-hover); }
        .dropzone.dragover { border-color: var(--accent); background: rgba(201, 169, 98, 0.03); }
        .dropzone.processing { border-style: solid; border-color: var(--accent); cursor: default; }

        .mic-box {
            margin-top: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            padding: 1rem;
        }

        .mic-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .mic-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .mic-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .mic-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .mic-timer {
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .mic-recording .mic-timer {
            display: inline-flex;
        }

        .mic-timer-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .mic-preview {
            margin-top: 0.75rem;
            display: none;
        }

        .mic-preview.active {
            display: block;
        }

        .mic-preview audio {
            width: 100%;
            height: 40px;
        }



        .dropzone-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            color: var(--accent);
        }

        .dropzone-text { color: var(--text-secondary); font-size: 0.9375rem; }
        .dropzone-hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.5rem; }

        input[type="file"] { display: none; }

        .progress { margin-top: 1.5rem; display: none; }
        .progress.active { display: block; }

        .progress-bar {
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 200ms ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            text-align: center;
        }

        .cancel-btn {
            display: none;
            align-items: center;
            gap: 0.375rem;
            margin: 1rem auto 0;
            padding: 0.375rem 0.75rem;
            border: none;
            background: transparent;
            color: var(--error);
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity var(--transition);
        }

        .cancel-btn:hover { opacity: 1; }
        .cancel-btn.active { display: inline-flex; }

        .text-input-wrapper { position: relative; }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9375rem;
            line-height: 1.6;
            resize: vertical;
            transition: border-color var(--transition);
        }

        .text-input:focus { outline: none; border-color: var(--accent); }
        .text-input::placeholder { color: var(--text-muted); }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .speaker-select {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .char-count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .char-count.warning { color: var(--error); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--border-hover); }

        .result { display: none; margin-top: 2rem; animation: fadeIn 200ms ease; }
        .result.active { display: block; }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .result-meta-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.15rem;
        }

        .result-meta-sub { font-size: 0.72rem; color: var(--text-muted); }

        .result-title { font-size: 0.875rem; font-weight: 500; color: var(--accent); }
        .result-meta { font-size: 0.75rem; color: var(--text-muted); }

        .stt-view-toggle {
            display: inline-flex;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
        }

        .stt-view-btn {
            padding: 0.38rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
        }

        .stt-view-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .stt-view-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg-tertiary));
        }

        .result-actions { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }

        .result-content {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-sizing: border-box;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            line-height: 1.7;
            white-space: pre-wrap;
            min-height: 300px;
            width: 100%;
            resize: none;
            outline: none;
            appearance: none;
            overflow-y: auto;
        }

        .result-content:focus { border-color: var(--accent); }

        .stt-resize-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            margin-top: 0.25rem;
            color: var(--text-muted);
            cursor: ns-resize;
            touch-action: none;
            user-select: none;
        }

        .stt-resize-handle::before {
            content: '';
            width: 56px;
            height: 4px;
            border-radius: 999px;
            background: var(--border);
            transition: background var(--transition);
        }

        .stt-resize-handle:hover::before,
        .stt-resize-handle.active::before {
            background: var(--accent);
        }

        body.stt-resizing,
        body.stt-resizing * {
            cursor: ns-resize !important;
            user-select: none !important;
        }

        .result-content::-webkit-scrollbar { width: 6px; }
        .result-content::-webkit-scrollbar-track { background: transparent; }
        .result-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .audio-player { width: 100%; margin-top: 1rem; }
        .audio-player audio { width: 100%; height: 40px; }

        .error {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(201, 92, 92, 0.1);
            border: 1px solid rgba(201, 92, 92, 0.2);
            border-radius: var(--radius);
            color: var(--error);
            font-size: 0.875rem;
        }

        .error.active { display: block; animation: fadeIn 200ms ease; }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            animation: slideIn 200ms ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .main { padding: 2rem 1rem; }
            .tabs { width: 100%; }
            .tab { flex: 1; text-align: center; }
            .dropzone { padding: 2rem 1rem; }
            .locale-picker { width: 150px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="jobsMenuBtn" type="button" data-i18n="jobsOpenAria" data-i18n-attr="aria-label" aria-label="Open jobs list">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="header-center">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                Resonance
            </div>
        </div>
        <div class="header-right">
            <div class="locale-picker" id="localePicker">
                <input
                    class="locale-picker-input"
                    id="localeInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    role="combobox"
                    aria-expanded="false"
                    aria-autocomplete="list"
                    aria-controls="localeListbox"
                    data-i18n="ariaLangGroup"
                    data-i18n-attr="aria-label"
                    aria-label="Interface language"
                >
                <svg class="locale-picker-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                <div class="locale-picker-list" id="localeListbox" role="listbox"></div>
            </div>
        </div>
    </header>

    <aside class="jobs-drawer" id="jobsDrawer" aria-hidden="true">
        <div class="jobs-drawer-header">
            <span class="jobs-drawer-title" data-i18n="jobsDrawerTitle">Jobs</span>
            <button class="menu-btn" id="jobsDrawerClose" type="button" data-i18n="jobsCloseAria" data-i18n-attr="aria-label" aria-label="Close jobs list">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="jobs-drawer-scroll" id="jobsDrawerScroll">
            <div id="jobsListState" data-i18n="jobsEmpty">No jobs yet.</div>
            <div id="jobsList" style="display: none;"></div>
            <div id="jobsFooter" class="jobs-footer" style="display: none;">
                <div id="jobsLoadMoreState" style="display: none;" data-i18n="jobsLoadingMore">Loading more…</div>
                <div id="jobsListEnd" style="display: none;" data-i18n="jobsListEnd">All jobs shown.</div>

        const I18N_LOCALES = window.__resonanceLocales || {};
        const LOCALE_LOAD_PROMISES = {};
        const EN_FROM_DOM = {};
        const DEFAULT_LOCALE_HELPERS = {
            formatCount(value) {
                return Number(value || 0).toLocaleString('en-US');
            },
            formatSttMeta(n) {
                return n + ' ' + (n === 1 ? 'segment' : 'segments');
            },
            formatSttProcessedTextDuration(seconds) {
                if (!Number.isFinite(seconds) || seconds <= 0) return '0.0s';
                if (seconds < 60) {
                    return seconds.toFixed(1) + 's';
                }
                const total = Math.max(1, Math.round(seconds));
                const hours = Math.floor(total / 3600);
                const mins = Math.floor((total % 3600) / 60);
                const secs = total % 60;
                if (hours > 0) {
                    return String(hours) + 'h ' + String(mins) + 'm';
                }
                return String(mins) + 'm ' + String(secs) + 's';
            },
            formatSttProcessedTextLabel(durationText) {
                return 'Processed text: ' + durationText;
            },
            formatTtsCharLine(len, maxChars, t) {
                const chunkN = len === 0 ? 0 : Math.ceil(len / maxChars);
                return len + ' ' + t('charUnit') + ' · ' + chunkN + ' ' + (chunkN === 1 ? 'chunk' : 'chunks');
            },
            formatTtsMeta(chunks, durationSec) {
                return chunks + ' ' + (chunks === 1 ? 'chunk' : 'chunks') + ' · ' + Number(durationSec).toFixed(1) + 's';

            formatTtsInputTooLongMessage(inputLimit, formatCount) {
                return 'Text too long (max ' + formatCount(inputLimit) + ' characters)';

                if (!Number.isFinite(seconds) || seconds <= 0) return null;
                const total = Math.max(1, Math.round(seconds));
                const mins = Math.floor(total / 60);
                const secs = total % 60;
                if (mins > 0) {
                    return String(mins) + ':' + String(secs).padStart(2, '0');
                }
                return String(secs) + 's';

                return date.toLocaleString('en-US');

        };
        const DEFAULT_TTS_LABELS = {
            languages: {
                ru: 'Russian',
                en: 'English'
            },
            voiceGroups: {
                silero_ru: {
                    ru_alexandr: 'Alexandr (Male)',

                    ru_saida: 'Saia (Female)',
                    ru_sibday: 'Sibday (Male)',
                    ru_zara: 'Zara (Female)',
                    ru_zhadyra: 'Zhadyra (Female) ★',
                    ru_zhazira: 'Zhazira (Female)',
                    ru_zinaida: 'Zinaida (Female)',
                    ru_eduard: 'Eduard (Male)'
                },
                kokoro_en: {
                    af_heart: 'Heart (Female)',
                    af_alloy: 'Alloy (Female)',
                    af_aoede: 'Aoede (Female)',
                    af_bella: 'Bella (Female)',
                    af_jessica: 'Jessica (Female)',
                    af_kore: 'Kore (Female)',
                    af_nicole: 'Nicole (Female)',
                    af_nova: 'Nova (Female)',
                    af_river: 'River (Female)',
                    af_sarah: 'Sarah (Female)',
                    af_sky: 'Sky (Female)',
                    am_adam: 'Adam (Male)',
                    am_echo: 'Echo (Male)',
                    am_eric: 'Eric (Male)',
                    am_fenrir: 'Fenrir (Male)',
                    am_liam: 'Liam (Male)',
                    am_michael: 'Michael (Male)',

                    am_puck: 'Puck (Male)',
                    am_santa: 'Santa (Male)',
                    bf_alice: 'Alice (Female)',

                }
            }
        };

        function captureEnDefaultsFromDom() {
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                const attr = el.getAttribute('data-i18n-attr');
                const val = attr ? (el.getAttribute(attr) || '') : (el.textContent || '').trim();
                EN_FROM_DOM[key] = val;
            });
        }

        function canonicalizeLocale(loc) {
            try {
                const list = Intl.getCanonicalLocales(String(loc || '').trim());
                return list && list.length ? list[0] : null;
            } catch (e) {
                return null;
            }
        }

        function findLocaleCode(loc) {
            const canonical = canonicalizeLocale(loc);
            if (!canonical) return null;
            for (const item of AVAILABLE_LOCALES) {
                if (item.code === canonical) return item.code;
            }
            const base = canonical.split('-')[0];
            for (const item of AVAILABLE_LOCALES) {
                if (item.code === base) return item.code;
            }
            return null;
        }

        function getLocale() {
            if (typeof window.__resonanceResolveLocale === 'function') {
                return window.__resonanceResolveLocale();
            }
            try {
                const s = localStorage.getItem(LOCALE_STORAGE_KEY);
                const stored = findLocaleCode(s);
                if (stored) return stored;
            } catch (e) {}
            const list = navigator.languages || [navigator.language || ''];
            for (const raw of list) {
                const matched = findLocaleCode(raw);
                if (matched) return matched;
            }
            return DEFAULT_LOCALE;
        }

        function getLocaleConfig(loc) {
            const code = findLocaleCode(loc);
            if (!code) return null;
            return AVAILABLE_LOCALES.find((item) => item.code === code) || null;
        }

        function isLocaleAvailable(loc) {
            return Boolean(getLocaleConfig(loc));
        }

        function isLocaleLoaded(loc) {
            return loc === DEFAULT_LOCALE || Object.prototype.hasOwnProperty.call(I18N_LOCALES, loc);
        }

        function ensureLocaleLoaded(loc) {
            if (!isLocaleAvailable(loc)) {
                return Promise.reject(new Error('Unknown locale: ' + loc));
            }
            if (isLocaleLoaded(loc)) {
                return Promise.resolve();
            }
            if (LOCALE_LOAD_PROMISES[loc]) {
                return LOCALE_LOAD_PROMISES[loc];
            }

            const cfg = getLocaleConfig(loc);
            if (!cfg || !cfg.src) {
                return Promise.reject(new Error('Locale has no source: ' + loc));
            }

            LOCALE_LOAD_PROMISES[loc] = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = cfg.src;
                script.async = true;
                script.onload = () => {
                    if (isLocaleLoaded(loc)) resolve();
                    else reject(new Error('Locale did not register: ' + loc));
                };
                script.onerror = () => reject(new Error('Failed to load locale: ' + loc));
                document.head.appendChild(script);
            }).catch((err) => {
                delete LOCALE_LOAD_PROMISES[loc];
                throw err;
            });

            return LOCALE_LOAD_PROMISES[loc];
        }

        function getLocaleMessages(loc) {
            if (loc === DEFAULT_LOCALE) return null;
            const entry = I18N_LOCALES[loc] || null;
            return entry ? (entry.messages || {}) : null;
        }

        function getLocaleHelpers(loc) {
            if (loc === DEFAULT_LOCALE) return DEFAULT_LOCALE_HELPERS;
            const entry = I18N_LOCALES[loc] || null;
            if (!entry || !entry.helpers) return DEFAULT_LOCALE_HELPERS;
            return { ...DEFAULT_LOCALE_HELPERS, ...entry.helpers };
        }

        function getLocaleTtsLabels(loc) {
            if (loc === DEFAULT_LOCALE) return DEFAULT_TTS_LABELS;
            const entry = I18N_LOCALES[loc] || null;
            if (!entry || !entry.tts) return DEFAULT_TTS_LABELS;
            return {
                languages: { ...DEFAULT_TTS_LABELS.languages, ...(entry.tts.languages || {}) },
                voiceGroups: {
                    ...DEFAULT_TTS_LABELS.voiceGroups,
                    ...(entry.tts.voiceGroups || {})
                }
            };
        }

        function getVoiceLabel(labels, voice) {
            if (!voice || !voice.id) return '';
            const backendId = voice.backend_id || '';
            const group = backendId ? labels.voiceGroups[backendId] : null;
            return (group && group[voice.id]) || formatFallbackVoiceLabel(voice.id);
        }

        function titleCaseWord(value) {
            if (!value) return '';
            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function formatFallbackVoiceLabel(voiceId) {
            if (!voiceId) return '';
            if (voiceId.startsWith('ru_')) return voiceId;
            const parts = voiceId.split('_');
            if (parts.length !== 2) return voiceId;
            const region = { af: 'US', am: 'US', bf: 'UK', bm: 'UK' }[parts[0]] || parts[0].toUpperCase();
            return titleCaseWord(parts[1]) + ' (' + region + ')';
        }

        const initialLocale = getLocale();
        let currentLocale = DEFAULT_LOCALE;
        document.documentElement.lang = currentLocale;

        async function setLocale(loc, options = {}) {
            if (!isLocaleAvailable(loc)) return false;
            if (loc !== DEFAULT_LOCALE) {
                try {
                    await ensureLocaleLoaded(loc);
                } catch (err) {
                    console.error('Locale load error:', err);
                    return false;
                }
            }
            currentLocale = loc;
            if (options.persist !== false) {
                localStorage.setItem(LOCALE_STORAGE_KEY, loc);
            }
            document.documentElement.lang = loc;
            applyI18n();
            return true;
        }

        function t(key, params) {
            const en = EN_FROM_DOM[key] ?? I18N_EN_SCRIPT[key];
            const active = getLocaleMessages(currentLocale);
            let str = active ? (active[key] ?? en ?? key) : (en ?? key);
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    str = str.split('{' + k + '}').join(String(v));
                }
            }
            return str;
        }

        function formatSttMeta(n) {
            return getLocaleHelpers(currentLocale).formatSttMeta(n);
        }

        function formatSttBlockTime(startSec, endSec) {
            const formatPart = (totalSec) => {
                const safe = Math.max(0, Math.floor(totalSec));
                const hours = Math.floor(safe / 3600);
                const minutes = Math.floor((safe % 3600) / 60);
                const seconds = safe % 60;
                if (hours > 0) {
                    return String(hours) + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
                }
                return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            };
            return formatPart(startSec) + '-' + formatPart(endSec);
        }

        function formatSttProcessedTextDuration(seconds) {
            return getLocaleHelpers(currentLocale).formatSttProcessedTextDuration(seconds);
        }

        function formatSttProcessedTextLabel(durationText) {
            return getLocaleHelpers(currentLocale).formatSttProcessedTextLabel(durationText);
        }

        /** Merge overlapping chunk transcripts for display; keep in sync with tests/test_stt_merge.py */
        function mergeTwoSttStrings(a, b) {
            const aTrim = (a || '').trim();
            const bTrim = (b || '').trim();
            if (!bTrim) return aTrim;
            if (!aTrim) return bTrim;
            const maxK = Math.min(aTrim.length, bTrim.length, 1200);
            for (let k = maxK; k >= 1; k--) {
                if (aTrim.slice(-k) === bTrim.slice(0, k)) {
                    return aTrim + bTrim.slice(k);
                }
            }
            const wa = aTrim.split(/\s+/).filter(Boolean);
            const wb = bTrim.split(/\s+/).filter(Boolean);
            const maxW = Math.min(wa.length, wb.length, 48);
            for (let kw = maxW; kw >= 1; kw--) {
                let match = true;
                for (let j = 0; j < kw; j++) {
                    if (wa[wa.length - kw + j] !== wb[j]) {
                        match = false;
                        break;
                    }
                }
                if (match) {
                    return wa.concat(wb.slice(kw)).join(' ');
                }
            }
            return aTrim + ' ' + bTrim;
        }

        function mergeAdjacentSttTexts(segments) {
            if (!segments.length) return '';
            let out = String(segments[0].text != null ? segments[0].text : '').trim();
            for (let i = 1; i < segments.length; i++) {
                const next = String(segments[i].text != null ? segments[i].text : '').trim();
                out = mergeTwoSttStrings(out, next);
            }
            return out;
        }

        /** Merge overlapping/adjacent segment coverage for display; keep in sync with tests/test_stt_merge.py */
        function mergeSttTimeRanges(segments) {
            const ranges = segments
                .filter((segment) => segment && Number.isFinite(segment.start) && Number.isFinite(segment.end))
                .map((segment) => ({
                    start: Math.min(segment.start, segment.end),
                    end: Math.max(segment.start, segment.end)
                }))
                .sort((a, b) => a.start - b.start || a.end - b.end);
            if (!ranges.length) return [];
            const out = [ranges[0]];
            for (let i = 1; i < ranges.length; i++) {
                const next = ranges[i];
                const last = out[out.length - 1];
                if (next.start <= last.end) {
                    last.end = Math.max(last.end, next.end);
                    continue;
                }
                out.push(next);
            }
            return out;
        }

        function buildSttTimeRangesText(segments) {
            const ranges = mergeSttTimeRanges(segments);
            if (!ranges.length) return '';
            const durationSec = ranges[ranges.length - 1].end;
            return formatSttProcessedTextLabel(formatSttProcessedTextDuration(durationSec));
        }

        function buildSttBlocks(segments, blockSec = 30) {
            if (!(blockSec > 0)) {
                throw new Error('blockSec must be positive');
            }
            const totalDuration = processedSttTextDuration(segments);
            if (!(totalDuration > 0)) return [];

            const blocks = new Map();
            let transcript = '';
            for (const segment of segments) {
                const segmentText = String(segment && segment.text != null ? segment.text : '').trim();
                if (!segmentText) continue;
                const merged = mergeTwoSttStrings(transcript, segmentText);
                const delta = merged.startsWith(transcript) ? merged.slice(transcript.length).trim() : '';
                transcript = merged;
                if (!delta) continue;
                const midpoint = (Number(segment.start) + Number(segment.end)) / 2;
                const index = Math.floor(midpoint / blockSec);
                if (!blocks.has(index)) {
                    const start = index * blockSec;
                    blocks.set(index, {
                        start,
                        end: Math.min((index + 1) * blockSec, totalDuration),
                        text: ''
                    });
                }
                const block = blocks.get(index);
                block.text = (block.text + ' ' + delta).trim();
            }

            return Array.from(blocks.entries())
                .sort((a, b) => a[0] - b[0])
                .map(([, block]) => block)
                .filter((block) => block.text);
        }

        function buildSttBlocksText(segments) {
            return buildSttBlocks(segments)
                .map((block) => '[' + formatSttBlockTime(block.start, block.end) + '] ' + block.text)
                .join('\n\n');
        }

        function processedSttTextDuration(segments) {
            const ranges = mergeSttTimeRanges(segments);
            return ranges.length ? ranges[ranges.length - 1].end : 0;
        }

            const resizeState = state.stt.resize;
            const currentPageY = window.scrollY + clientY;
            const nextHeight = Math.max(220, resizeState.startHeight + (currentPageY - resizeState.startPageY));
            els.sttResultText.style.height = nextHeight + 'px';

        function tickSttResizeAutoScroll() {
            const resizeState = state.stt.resize;
            if (!resizeState.active) {
                resizeState.autoScrollRaf = null;
                return;
            }
            const edge = 56;
            const topDelta = edge - resizeState.lastClientY;
            const bottomDelta = resizeState.lastClientY - (window.innerHeight - edge);
            let scrollStep = 0;
            if (bottomDelta > 0) {
                scrollStep = Math.min(24, Math.max(6, bottomDelta * 0.35));
            } else if (topDelta > 0) {
                scrollStep = -Math.min(24, Math.max(6, topDelta * 0.35));
            }
            if (scrollStep !== 0) {
                window.scrollBy(0, scrollStep);
                applySttResizeFromPointer(resizeState.lastClientY);
            }
            resizeState.autoScrollRaf = requestAnimationFrame(tickSttResizeAutoScroll);
        }

        function stopSttResize() {
            const resizeState = state.stt.resize;
            if (!resizeState.active) return;
            resizeState.active = false;
            resizeState.pointerId = null;

                cancelAnimationFrame(resizeState.autoScrollRaf);
                resizeState.autoScrollRaf = null;

            els.sttResizeHandle.classList.remove('active');
            document.body.classList.remove('stt-resizing');

        function applySttJobStatus(status) {
            const segs = Array.isArray(status.result && status.result.segments)
                ? status.result.segments
                    .filter(s => s && Number.isFinite(s.start) && Number.isFinite(s.end) && typeof s.text === 'string')
                    .map(s => ({ start: s.start, end: s.end, text: s.text }))
                : [];
            if (!segs.length) return;
            state.stt.segments = segs;
            els.sttResult.classList.add('active');
            els.sttProgress.classList.add('active');
            const total = status.progress_total || segs.length;
            const current = status.progress_current || segs.length;
            state.stt.progressCurrent = current;
            state.stt.progressTotal = total;
            const pct = total > 0 ? (current / total) * 100 : 0;
            els.sttProgressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
            if (status.state === 'completed') {
                els.sttProgressText.textContent = t('progressComplete');
            } else {
                els.sttProgressText.textContent = t('progressChunk', { current, total });
            }
            if (status.result && status.result.filename) {
                els.sttResultText.dataset.filename = status.result.filename;
            }
            refreshSttResultDisplay();
        }

            els.ttsResult.classList.add('active');
            els.ttsAudio.src = result.download_url;
            els.ttsMeta.textContent = formatTtsMeta(

	        function formatJobState(stateName) {
	            const map = {
	                queued: 'jobsStateQueued',
	                running: 'jobsStateRunning',
	                completed: 'jobsStateCompleted',
	                failed: 'jobsStateFailed',
	                cancelled: 'jobsStateCancelled',
	            };
	            return t(map[stateName] || 'jobsStateQueued');
	        }

	        function getJobDurationSec(job) {
	            if (job && Number.isFinite(Number(job.duration)) && Number(job.duration) > 0) {
	                return Number(job.duration);
	            }
	            const result = job && job.result ? job.result : null;
	            if (result && Number.isFinite(Number(result.duration)) && Number(result.duration) > 0) {
	                return Number(result.duration);
	            }
	            if (job && job.job_type === 'stt' && result && Array.isArray(result.segments)) {
	                let maxEnd = 0;
	                for (const s of result.segments) {
	                    const end = s && Number.isFinite(Number(s.end)) ? Number(s.end) : 0;
	                    if (end > maxEnd) maxEnd = end;
	                }
	                if (maxEnd > 0) return maxEnd;
	            }
	            return null;
	        }

	            btn.style.padding = '0.625rem 0.75rem';
	            const durationSec = getJobDurationSec(job);
	            const durationText = Number.isFinite(durationSec) ? formatSttProcessedTextDuration(durationSec) : '-';
	            const durationSuffix = durationText !== '-' ? ` · ${durationText}` : '';
	            const updated = new Date(Number(job.updated_at || 0) * 1000);
	            const updatedText = Number.isFinite(updated.getTime())
	                ? getLocaleHelpers(currentLocale).formatDateTime(updated)
	                : '-';
	            btn.innerHTML = `
	                <div style="font-weight: 600;">${formatJobType(job.job_type)} · ${formatJobState(job.state)}${durationSuffix}</div>
	                <div style="opacity: 0.75; font-size: 0.8rem;">${updatedText}</div>
	            `;
	            btn.addEventListener('click', () => restoreJob(job.job_id, job.job_type));
	            return btn;
	        }

        function setupJobsInfiniteScroll() {
            disconnectJobsInfiniteScroll();
            if (!state.jobsHasMore || !els.jobsDrawerScroll || !els.jobsListSentinel) {
                return;
            }
            const obs = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        loadMoreJobs();
                    }
                }
            }, {
                root: els.jobsDrawerScroll,
                rootMargin: '200px 0px',
                threshold: 0,

        async function loadMoreJobs() {
            if (!state.jobsHasMore || state.jobsLoadingMore || state.jobsLoadingInitial) {
                return;
            }
            if (!els.jobsDrawer.classList.contains('open')) {
                return;
            }
            state.jobsLoadingMore = true;
            updateJobsFooterUi();
            try {
                const res = await fetch(
                    API_URL + '/jobs?limit=' + JOBS_PAGE_SIZE + '&offset=' + encodeURIComponent(String(state.jobsNextOffset))
                );
                if (!res.ok) {
                    throw new Error('jobs-more-failed');
                }
                const payload = await res.json();
                const incoming = Array.isArray(payload.jobs) ? payload.jobs : [];
                const existing = new Set(state.jobsList.map((j) => j.job_id));
                for (const j of incoming) {
                    if (j && j.job_id && !existing.has(j.job_id)) {
                        existing.add(j.job_id);
                        state.jobsList.push(j);
                    }
                }
                state.jobsHasMore = !!payload.has_more;
                state.jobsNextOffset = typeof payload.next_offset === 'number'
                    ? payload.next_offset
                    : state.jobsNextOffset + incoming.length;
            } catch (e) {
                showToast(t('errNetwork'));
            } finally {
                state.jobsLoadingMore = false;
                rebuildJobsListFromState();
                updateJobsFooterUi();
                disconnectJobsInfiniteScroll();
                if (state.jobsHasMore && els.jobsDrawer.classList.contains('open')) {
                    setupJobsInfiniteScroll();
                }
            }
        }

        async function loadJobsList() {
            disconnectJobsInfiniteScroll();
            state.jobsList = [];
            state.jobsNextOffset = 0;
            state.jobsHasMore = false;
            state.jobsLoadingInitial = true;
            showJobsState('jobsLoading');
            try {
                const res = await fetch(API_URL + '/jobs?limit=' + JOBS_PAGE_SIZE + '&offset=0');
                if (!res.ok) {
                    throw new Error('jobs-list-failed');
                }
                const payload = await res.json();
                state.jobsList = Array.isArray(payload.jobs) ? payload.jobs : [];
                state.jobsHasMore = !!payload.has_more;
                state.jobsNextOffset = typeof payload.next_offset === 'number'
                    ? payload.next_offset
                    : state.jobsList.length;
            } catch (e) {
                state.jobsLoadingInitial = false;
                showJobsState('jobsLoadError');
                return;
            }
            state.jobsLoadingInitial = false;
            if (!els.jobsDrawer.classList.contains('open')) {
                return;
            }
            if (!state.jobsList.length) {
                showJobsState('jobsEmpty');
                return;
            }
            showJobsListUi();

        async function restoreJob(jobId, jobType) {
            clearAllStreamsAndSelections();
            resetUI('STT', false);
            resetUI('TTS', false);
            switchTab(jobType === 'stt' ? 'stt' : 'tts');

            const type = jobType === 'stt' ? 'STT' : 'TTS';
            const status = await fetchJobStatus(type, jobId);
            if (!status) {
                await loadJobsList();
                return;
            }

            if (jobType === 'stt') {
                if (status.state === 'failed') {
                    resetUI('STT', false);
                    await loadJobsList();
                    return;
                }
                applySttJobStatus(status);
                if (status.state === 'running' || status.state === 'queued') {
                    setActiveJobId('STT', jobId);
                    els.sttCancel.classList.add('active');
                    els.sttHide.classList.add('active');
                    els.sttProgress.classList.add('active');
                    subscribeSttJobEvents(jobId, state.stt.segments || [], refreshSttResultDisplay);
                }
            } else {
                if (status.state === 'failed' || status.state === 'cancelled') {
                    resetUI('TTS', false);
                    await loadJobsList();
                    return;
                }
                if (status.state === 'completed') {
                    applyTtsJobStatus(status);
                } else {
                    setActiveJobId('TTS', jobId);
                    els.ttsSubmit.disabled = true;
                    els.ttsProgress.classList.add('active');
                    els.ttsCancel.classList.add('active');
                    const total = status.progress_total || 1;
                    const current = status.progress_current || 0;
                    state.tts.progressCurrent = current;
                    state.tts.progressTotal = total;
                    const pct = total > 0 ? (current / total) * 100 : 0;
                    els.ttsProgressFill.style.width = pct + '%';
                    els.ttsProgressText.textContent = t('progressChunk', { current, total });
                    subscribeTtsJobEvents(jobId, status.result && status.result.filename ? status.result.filename : 'tts_output');
                }

        }

            const filtered = getFilteredLocales();
            if (e.key === 'Escape') {
                closeLocalePicker(true);
                els.localeInput.blur();
                return;
            }
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!els.localePicker.classList.contains('open')) {
                    openLocalePicker();
                    return;
                }
                if (!filtered.length) return;
                const delta = e.key === 'ArrowDown' ? 1 : -1;
                const nextIndex = state.localeHighlightIndex < 0
                    ? getInitialLocaleHighlightIndex(filtered)
                    : (state.localeHighlightIndex + delta + filtered.length) % filtered.length;
                highlightLocaleOption(nextIndex, true);
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!filtered.length) return;
                const selected = filtered[state.localeHighlightIndex] || filtered[0];
                await commitLocaleSelection(selected.code);
                els.localeInput.blur();

        function mergeMicPcmChunks(chunks, totalSamples) {
            const merged = new Float32Array(totalSamples);
            let offset = 0;
            for (const chunk of chunks) {
                merged.set(chunk, offset);
                offset += chunk.length;
            }
            return merged;
        }

        function encodeMicWav(samples, sampleRate) {
            const bytesPerSample = 2;
            const dataSize = samples.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            const writeAscii = (offset, text) => {
                for (let i = 0; i < text.length; i++) {
                    view.setUint8(offset + i, text.charCodeAt(i));
                }
            };

            writeAscii(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeAscii(8, 'WAVE');
            writeAscii(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * bytesPerSample, true);
            view.setUint16(32, bytesPerSample, true);
            view.setUint16(34, 16, true);
            writeAscii(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++) {
                const sample = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(
                    offset,
                    sample < 0 ? sample * 0x8000 : sample * 0x7fff,
                    true
                );
                offset += bytesPerSample;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
