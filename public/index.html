        async function startSttMicRecording() {
            const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AudioContextCtor) {
                showSttError(t('errMicUnsupported'));
                return;
            }
            els.sttError.classList.remove('active');
            clearSttMicPreview();
            sttMicState.pcmChunks = [];
            sttMicState.pcmSampleRate = 0;
            sttMicState.pcmSampleCount = 0;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                sttMicState.stream = stream;
                const audioContext = new AudioContextCtor();
                await audioContext.resume();
                const sourceNode = audioContext.createMediaStreamSource(stream);
                const processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                const monitorGainNode = audioContext.createGain();
                monitorGainNode.gain.value = 0;

                sttMicState.audioContext = audioContext;
                sttMicState.sourceNode = sourceNode;
                sttMicState.processorNode = processorNode;
                sttMicState.monitorGainNode = monitorGainNode;
                sttMicState.pcmSampleRate = audioContext.sampleRate;

                processorNode.onaudioprocess = (event) => {
                    const input = event.inputBuffer.getChannelData(0);
                    if (!input || input.length === 0) return;
                    const chunk = new Float32Array(input.length);
                    chunk.set(input);
                    sttMicState.pcmChunks.push(chunk);
                    sttMicState.pcmSampleCount += chunk.length;
                };

                sourceNode.connect(processorNode);
                processorNode.connect(monitorGainNode);
                monitorGainNode.connect(audioContext.destination);

                startSttMicTimer();
                setSttMicRecordingUi(true);
                setSttMicHint('sttMicHintRecording');
            } catch (e) {
                stopSttMicTracks();
                stopSttMicTimer();
                setSttMicRecordingUi(false);
                showSttError(t('errMicPermission'));
                setSttMicHint('sttMicHintIdle');
            }
        }

        function stopSttMicRecording() {
            if (!sttMicState.audioContext) return;
            setSttMicRecordingUi(false);
            stopSttMicTimer();

            const sampleRate = sttMicState.pcmSampleRate;
            const sampleCount = sttMicState.pcmSampleCount;
            const samples = mergeMicPcmChunks(sttMicState.pcmChunks, sampleCount);

            stopSttMicTracks();

            if (!samples.length || !sampleRate) {
                showSttError(t('errMicEmpty'));
                setSttMicHint('sttMicHintIdle');
                return;
            }

            const blob = encodeMicWav(samples, sampleRate);
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            const file = new File([blob], 'mic_' + stamp + '.wav', { type: 'audio/wav' });

            sttMicState.blob = blob;
            sttMicState.file = file;
            sttMicState.previewUrl = URL.createObjectURL(blob);
            sttMicState.duration = sampleCount / sampleRate;

            setAudioElementSource(els.sttMicAudio, sttMicState.previewUrl);
            els.sttMicPreview.classList.add('active');
            els.sttMicSend.style.display = '';
            els.sttMicDiscard.style.display = '';
            setSttMicHint('sttMicHintReady');
        }

        async function sendSttMicRecording() {
            if (!sttMicState.file) return;
            const file = sttMicState.file;
            clearSttMicPreview();
            setSttMicHint('sttMicHintIdle');
            await handleSttFile(file);
        }

        function discardSttMicRecording() {
            clearSttMicPreview();
            setSttMicHint('sttMicHintIdle');
        }

        function closeJobStreams(type) {
            const job = state[type.toLowerCase()];
            if (job.eventSource) {
                job.eventSource.close();
                job.eventSource = null;
            }
            if (job.statusPollTimer) {
                clearInterval(job.statusPollTimer);
                job.statusPollTimer = null;
            }
        }

        async function cancelActiveServerJob(type) {
            const jobId = state[type.toLowerCase()].jobId;
            if (!jobId) return;
            try {
                await fetch(API_URL + '/jobs/' + encodeURIComponent(jobId) + '/cancel', {
                    method: 'POST'
                });
            } catch (e) {
            }
        }

        function cancelJob(type) {
            closeJobStreams(type);
            cancelActiveServerJob(type);
            setActiveJobId(type, null);
            resetUI(type, false);
            refreshJobsListIfOpen();
        }

        function hideJob(type) {
            closeJobStreams(type);
            setActiveJobId(type, null);
            resetUI(type, true);
            refreshJobsListIfOpen();
        }

        function subscribeSttJobEvents(jobId, segments, updateDisplay) {
            closeJobStreams('STT');
            const es = new EventSource(API_URL + '/jobs/' + encodeURIComponent(jobId) + '/events');
            state.stt.eventSource = es;
            es.onmessage = (ev) => {
                let event;
                try {
                    event = JSON.parse(ev.data);
                } catch {
                    return;
                }
                switch (event.type) {
                    case 'start':
                        state.stt.progressCurrent = 0;
                        state.stt.progressTotal = event.total || 0;
                        els.sttProgressText.textContent = t('progressProcessing');
                        break;
                    case 'progress':
                        state.stt.progressCurrent = event.current || 0;
                        state.stt.progressTotal = event.total || 0;
                        const pct = event.total > 0 ? (event.current / event.total) * 100 : 0;
                        els.sttProgressFill.style.width = pct + '%';
                        els.sttProgressText.textContent = t('progressChunk', {
                            current: event.current,
                            total: event.total
                        });
                        if (event.segment) {
                            segments.push(event.segment);
                            updateDisplay();
                        }
                        break;
                    case 'complete':
                        state.stt.progressCurrent = state.stt.progressTotal || 0;
                        els.sttProgressFill.style.width = '100%';
                        els.sttProgressText.textContent = t('progressComplete');
                        updateDisplay();
                        setActiveJobId('STT', null);
                        closeJobStreams('STT');
                        refreshJobsListIfOpen();
                        setTimeout(() => resetUI('STT', true), 800);
                        break;
                    case 'error':
                        els.sttError.textContent = event.message || t('errProcessingFailed');
                        els.sttError.classList.add('active');
                        setActiveJobId('STT', null);
                        closeJobStreams('STT');
                        refreshJobsListIfOpen();
                        resetUI('STT');
                        break;
                    case 'cancelled':
                        setActiveJobId('STT', null);
                        closeJobStreams('STT');
                        refreshJobsListIfOpen();
                        resetUI('STT');
                        break;
                }
            };
            es.onerror = async () => {
                closeJobStreams('STT');
                const status = await fetchJobStatus('STT', jobId);
                if (!status || status.state === 'failed') {
                    els.sttError.textContent = (status && status.error) || t('errNetwork');
                    els.sttError.classList.add('active');
                    setActiveJobId('STT', null);
                    resetUI('STT');
                    return;
                }
                if (status.state === 'completed') {
                    applySttJobStatus(status);
                    setActiveJobId('STT', null);
                    setTimeout(() => resetUI('STT', true), 800);
                    return;
                }
                if (status.state === 'cancelled') {
                    setActiveJobId('STT', null);
                    resetUI('STT');
                    return;
                }
                subscribeSttJobEvents(jobId, segments, updateDisplay);
            };
        }

        function subscribeTtsJobEvents(jobId, filename) {
            closeJobStreams('TTS');
            const es = new EventSource(API_URL + '/jobs/' + encodeURIComponent(jobId) + '/events');
            state.tts.eventSource = es;
            es.onmessage = (ev) => {
                let event;
                try {
                    event = JSON.parse(ev.data);
                } catch {
                    return;
                }
                switch (event.type) {
                    case 'start':
                        state.tts.progressCurrent = 0;
                        state.tts.progressTotal = event.total || 0;
                        els.ttsProgressText.textContent = t('progressProcessing');
                        break;
                    case 'progress':
                        state.tts.progressCurrent = event.current || 0;
                        state.tts.progressTotal = event.total || 0;
                        const pct2 = event.total > 0 ? (event.current / event.total) * 100 : 0;
                        els.ttsProgressFill.style.width = pct2 + '%';
                        els.ttsProgressText.textContent = t('progressChunk', {
                            current: event.current,
                            total: event.total
                        });
                        break;
                    case 'complete':
                        state.tts.progressCurrent = state.tts.progressTotal || 0;
                        els.ttsProgressFill.style.width = '100%';
                        els.ttsProgressText.textContent = t('progressComplete');
                        els.ttsResult.classList.add('active');
                        const downloadUrl = event.download_url;
                        els.ttsAudio.src = downloadUrl;
                        els.ttsMeta.textContent = formatTtsMeta(event.chunks, event.duration);
                        els.ttsDownload.onclick = () => {
                            const a = document.createElement('a');
                            a.href = downloadUrl;
                            a.download = filename + '.wav';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        };
                        setActiveJobId('TTS', null);
                        closeJobStreams('TTS');
                        refreshJobsListIfOpen();
                        els.ttsSubmit.disabled = false;
                        setTimeout(() => resetUI('TTS', true), 800);
                        break;
                    case 'error':
                        els.ttsError.textContent = event.message || t('errProcessingFailed');
                        els.ttsError.classList.add('active');
                        setActiveJobId('TTS', null);
                        closeJobStreams('TTS');
                        refreshJobsListIfOpen();
                        els.ttsSubmit.disabled = false;
                        resetUI('TTS');
                        break;
                    case 'cancelled':
                        setActiveJobId('TTS', null);
                        closeJobStreams('TTS');
                        refreshJobsListIfOpen();
                        els.ttsSubmit.disabled = false;
                        resetUI('TTS');
                        break;
                }
            };
            es.onerror = async () => {
                closeJobStreams('TTS');
                const status = await fetchJobStatus('TTS', jobId);
                if (!status || status.state === 'failed') {
                    els.ttsError.textContent = (status && status.error) || t('errNetwork');
                    els.ttsError.classList.add('active');
                    setActiveJobId('TTS', null);
                    els.ttsSubmit.disabled = false;
                    resetUI('TTS');
                    return;
                }
                if (status.state === 'completed') {
                    applyTtsJobStatus(status);
                    setActiveJobId('TTS', null);
                    els.ttsSubmit.disabled = false;
                    setTimeout(() => resetUI('TTS', true), 800);
                    return;
                }
                if (status.state === 'cancelled') {
                    setActiveJobId('TTS', null);
                    els.ttsSubmit.disabled = false;
                    resetUI('TTS');
                    return;
                }
                subscribeTtsJobEvents(jobId, filename);
            };
        }

        async function handleSttFile(file) {
            if (!file) return;

            cancelJob('STT');

            els.sttResult.classList.remove('active');
            els.sttError.classList.remove('active');
            els.sttDropzone.classList.add('processing');
            els.sttProgress.classList.add('active');
            els.sttHide.classList.add('active');
            els.sttCancel.classList.add('active');
            els.sttProgressFill.style.width = '5%';
            els.sttProgressText.textContent = t('progressUploading');

            const segments = [];
            state.stt.segments = segments;
            let myJobId = null;

            const updateDisplay = () => {
                refreshSttResultDisplay();
            };

            try {
                const formData = new FormData();
                formData.append('file', file);

                const startRes = await fetch(API_URL + '/jobs/stt', {
                    method: 'POST',
                    body: formData,
                });

                if (!startRes.ok) throw new Error(t('errUploadFailed'));
                const startData = await startRes.json();
                if (!startData.job_id) throw new Error(t('errNoResponseBody'));
                myJobId = startData.job_id;
                setActiveJobId('STT', myJobId);
                refreshJobsListIfOpen();

                els.sttResult.classList.add('active');
                els.sttResultText.dataset.filename = file.name;
                subscribeSttJobEvents(myJobId, segments, updateDisplay);
            } catch (err) {
                console.error('STT Error:', err);
                if (err.name !== 'AbortError') {
                    els.sttError.textContent = err.message || t('errNetwork');
                    els.sttError.classList.add('active');
                }
                setActiveJobId('STT', null);
                resetUI('STT');
            }
        }

        els.sttDropzone.addEventListener('click', () => els.sttFileInput.click());

        els.sttDropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            els.sttDropzone.classList.add('dragover');
        });

        els.sttDropzone.addEventListener('dragleave', () => {
            els.sttDropzone.classList.remove('dragover');
        });

        els.sttDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            els.sttDropzone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleSttFile(files[0]);
        });

        els.sttFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleSttFile(e.target.files[0]);
        });

        els.sttHide.addEventListener('click', (e) => {
            e.stopPropagation();
            hideJob('STT');
        });

        els.sttCancel.addEventListener('click', (e) => {
            e.stopPropagation();
            cancelJob('STT');
        });

        els.sttMicStart.addEventListener('click', startSttMicRecording);
        els.sttMicStop.addEventListener('click', stopSttMicRecording);
        els.sttMicSend.addEventListener('click', sendSttMicRecording);
        els.sttMicDiscard.addEventListener('click', discardSttMicRecording);
        els.sttMicAudio.addEventListener('loadedmetadata', () => {
            if (Number.isFinite(els.sttMicAudio.duration) && els.sttMicAudio.duration > 0) {
                sttMicState.duration = els.sttMicAudio.duration;
            }
        });

        let ttsSourceFilename = null;

        function handleTtsFile(file) {
            if (!file) return;
            ttsSourceFilename = file.name.replace(/\.[^/.]+$/, '');
            const reader = new FileReader();
            reader.onload = (e) => {
                els.ttsInput.value = e.target.result;
                updateTtsCharCount();
                syncTtsDraftStorage();
            };
            reader.onerror = () => showToast(t('toastReadFailed'));
            reader.readAsText(file);
        }

        els.ttsDropzone.addEventListener('click', () => els.ttsFileInput.click());

        els.ttsDropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            els.ttsDropzone.classList.add('dragover');
        });

        els.ttsDropzone.addEventListener('dragleave', () => {
            els.ttsDropzone.classList.remove('dragover');
        });

        els.ttsDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            els.ttsDropzone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleTtsFile(files[0]);
        });

        els.ttsFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleTtsFile(e.target.files[0]);
        });

        els.ttsCancel.addEventListener('click', (e) => {
            e.stopPropagation();
            cancelJob('TTS');
        });

        els.sttViewBlocks.addEventListener('click', () => {
            setSttViewMode('blocks');
            refreshSttResultDisplay();
        });

        els.sttViewContinuous.addEventListener('click', () => {
            setSttViewMode('continuous');
            refreshSttResultDisplay();
        });

        els.sttResizeHandle.addEventListener('pointerdown', startSttResize);
        els.sttResizeHandle.addEventListener('pointermove', handleSttResizePointerMove);
        els.sttResizeHandle.addEventListener('pointerup', stopSttResize);
        els.sttResizeHandle.addEventListener('pointercancel', stopSttResize);
        els.sttResizeHandle.addEventListener('lostpointercapture', stopSttResize);

        els.sttCopy.addEventListener('click', async () => {
            const text = getSttCopyText();

            const copyFallback = (txt) => {
                const textarea = document.createElement('textarea');
                textarea.value = txt;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return true;
                } catch {
                    document.body.removeChild(textarea);
                    return false;
                }
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(t('toastCopied'));
                    return;
                } catch {
                }
            }

            const success = copyFallback(text);
            showToast(success ? t('toastCopied') : t('toastCopyFailed'));
        });

        els.sttDownload.addEventListener('click', () => {
            const text = getSttContinuousText();
            const base = els.sttResultText.dataset.filename || t('defaultTranscriptionFile');
            const filename = base.replace(/\.[^/.]+$/, '');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        els.ttsInput.addEventListener('input', () => {
            updateTtsCharCount();
            syncTtsDraftStorage();
        });

        els.ttsLanguage.addEventListener('change', () => {
            const savedVoices = getSavedTtsVoiceByLanguage();
            renderTtsVoiceOptions(els.ttsLanguage.value, savedVoices[els.ttsLanguage.value] || null);
            localStorage.setItem(TTS_LANGUAGE_KEY, els.ttsLanguage.value);
            persistTtsVoiceSelection(els.ttsLanguage.value, els.ttsVoice.value);
        });

        els.ttsVoice.addEventListener('change', () => {
            persistTtsVoiceSelection(els.ttsLanguage.value, els.ttsVoice.value);
        });

        els.ttsSubmit.addEventListener('click', async () => {
            const text = els.ttsInput.value.trim();
            const inputLimit = getTtsInputLimit();
            if (!text) {
                els.ttsError.textContent = t('errPleaseEnterText');
                els.ttsError.classList.add('active');
                return;
            }
            if (inputLimit > 0 && text.length > inputLimit) {
                els.ttsError.textContent = formatTtsInputTooLongMessage();
                els.ttsError.classList.add('active');
                return;
            }

            cancelJob('TTS');
            els.ttsResult.classList.remove('active');
            els.ttsError.classList.remove('active');
            els.ttsSubmit.disabled = true;
            els.ttsProgress.classList.add('active');
            els.ttsCancel.classList.add('active');
            els.ttsProgressFill.style.width = '10%';
            els.ttsProgressText.textContent = t('progressStarting');

            let filename = ttsSourceFilename;
            if (!filename) {
                const now = new Date();
                const timestamp = now.toISOString()
                    .replace(/[:.]/g, '-')
                    .replace(/T/, '_')
                    .slice(0, -5);
                filename = 'tts_' + timestamp;
            }
            ttsSourceFilename = null;

            try {
                const res = await fetch(
                    API_URL + '/jobs/tts?text=' + encodeURIComponent(text) + '&language=' + encodeURIComponent(els.ttsLanguage.value) + '&voice_id=' + encodeURIComponent(els.ttsVoice.value) + '&filename=' + encodeURIComponent(filename),
                    { method: 'POST' }
                );
                if (!res.ok) throw new Error(t('errRequestFailed'));
                const payload = await res.json();
                if (!payload.job_id) throw new Error(t('errNoResponseBody'));
                setActiveJobId('TTS', payload.job_id);
                refreshJobsListIfOpen();
                subscribeTtsJobEvents(payload.job_id, filename);
            } catch (err) {
                console.error('TTS Error:', err);
                if (err.name !== 'AbortError') {
                    els.ttsError.textContent = err.message || t('errNetwork');
                    els.ttsError.classList.add('active');
                }
                setActiveJobId('TTS', null);
                resetUI('TTS');
            }
        });

        loadConfig();
    </script>
</body>
</html>
