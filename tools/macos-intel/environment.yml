# Intel macOS only. Native libraries must come from the same conda-forge solve.
name: resonance-intel
channels:
  - conda-forge
dependencies:
  - python=3.12.15
  - pytorch=2.13.0=cpu_generic*
  - torchaudio=2.11.0
  - torchcodec=0.16.0
  - numpy=2.2.6
  - ffmpeg=9.0.2
  - av=18.1.0
  - numba=0.61.2
  - llvmlite=0.44.0
  - nodejs=22.23.2
  - uv=0.12.23
  - micromamba=2.9.0
  - resvg=0.47.0
  - imagemagick=7.1.2_31
  - pip
